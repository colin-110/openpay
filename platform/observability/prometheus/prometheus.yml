# Two addresses per service, on purpose.
#
# The platform runs two ways: services in containers, or services from Maven on the host against
# containerised infrastructure. The right address differs — a container resolves "payment-service",
# a host process is reachable at host.docker.internal — and Prometheus cannot tell which workflow
# is in use. Listing both means whichever is running gets scraped without editing this file, at the
# cost that the other target shows as down. That is the honest trade: a permanently red target in
# the Prometheus UI, in exchange for metrics that work in both workflows out of the box.
#
# The `job` label is the service name, and every dashboard groups by it.

global:
  scrape_interval: 15s
  external_labels:
    platform: openpay

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080", "gateway-service:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081", "auth-service:8081"]

  - job_name: merchant-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082", "merchant-service:8082"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083", "payment-service:8083"]

  - job_name: webhook-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084", "webhook-service:8084"]

  - job_name: provider-router-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085", "provider-router-service:8085"]

  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8086", "ledger-service:8086"]

  - job_name: settlement-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8087", "settlement-service:8087"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8088", "notification-service:8088"]

  - job_name: fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8089", "fraud-service:8089"]

  - job_name: mock-bank-a
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9001", "mock-bank-a:9001"]

  - job_name: mock-bank-b
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9002", "mock-bank-b:9002"]
