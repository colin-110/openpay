apiVersion: 1

providers:
  - name: openpay
    orgId: 1
    folder: OpenPay
    type: file
    disableDeletion: false
    # Reloaded from disk, so editing a dashboard JSON in the repo and refreshing the browser is the
    # whole loop. Edits made in the UI are not saved back — the files are the source of truth.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
