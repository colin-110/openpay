services:
  postgres:
    image: postgres:15-alpine
    container_name: openpay-postgres
    # shared_buffers plus per-connection work_mem across up to 200 connections.
    mem_limit: 512m
    # Nine services share this one instance, each with its own database but all drawing from the
    # same global connection limit. At PostgreSQL's default max_connections=100 and HikariCP's
    # default pool of 10 opened eagerly, the stack idled at 96 of 100 connections — four away from
    # "FATAL: sorry, too many clients already", and with no room for a service to restart and
    # rebuild its pool while the others still hold theirs. 200 leaves headroom for the pools
    # configured in each service's application.yml to burst under load.
    command:
      - postgres
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: openpay
      POSTGRES_PASSWORD: openpay
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpay"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates any database a service needs but does not have.
  #
  # The scripts under /docker-entrypoint-initdb.d only run on an empty data directory, so adding a
  # service to that file does nothing for anyone whose volume already exists — their new service
  # crash-loops on "database does not exist" while every other service is healthy, which points at
  # the new service rather than at the volume. This runs the same file on every `up`; it is
  # idempotent, so doing that costs nothing.
  postgres-databases:
    image: postgres:15-alpine
    container_name: openpay-postgres-databases
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: openpay
    volumes:
      - ./postgres/init:/init:ro
    entrypoint:
      - sh
      - -c
      - psql -h postgres -U openpay -d postgres -v ON_ERROR_STOP=1 -f /init/001-create-databases.sql
    restart: "no"

  redis:
    # Small keyspace, all short-lived: rate-limit counters, login-throttle buckets, fraud velocity
    # counts, and payment tokens.
    mem_limit: 128m
    image: redis:8-alpine
    container_name: openpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Added when vault-service arrived, because it is the first service for which Redis is the only
    # store rather than an accelerator. Everything else here degrades when Redis is slow — the rate
    # limiter fails open, fraud velocity falls back to counting in PostgreSQL — so `service_started`
    # was honest for them. A vault that came up before Redis was answering would accept a card it
    # then had nowhere to put, and would do it during exactly the window a demo starts in.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    # The heaviest infrastructure JVM here; below this it struggles under the webhook spike.
    mem_limit: 1g
    image: apache/kafka:4.0.0
    container_name: openpay-kafka
    ports:
      - "9092:9092"
    environment:
      # Half the container limit, and the other half is the point.
      #
      # apache/kafka defaults to -Xmx1G -Xms1G, which under `mem_limit: 1g` means the heap alone is
      # the entire container: nothing left for metaspace, thread stacks, or the direct byte buffers
      # Kafka uses for every network read and write. The container sat at 93% and stayed there, and
      # the way that failed was not an OutOfMemoryError — it was the group coordinator's writes to
      # __consumer_offsets timing out after 5s, so SyncGroup returned COORDINATOR_NOT_AVAILABLE and
      # every consumer group rebalanced on a five-second loop without ever reaching a stable
      # assignment. Consumer lag froze, payments stopped advancing past CREATED, and no service
      # logged an error, because from the application's point of view nothing had gone wrong.
      #
      # It also did not recover on a broker restart, which is the part worth remembering: the load
      # that caused it was still on disk, so the broker returned to the same state immediately.
      #
      # A smaller heap is not a compromise here, it is what Kafka wants. Brokers keep very little
      # in the heap and lean on the OS page cache for log segments, so memory handed to the JVM is
      # memory taken away from the thing that actually serves reads.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners because a broker can only advertise one address per listener, and the
      # right address differs by caller. A container resolves "kafka"; a process on the host
      # cannot, and needs "localhost". Advertising only localhost, as this did before, leaves
      # every containerised consumer unable to connect after its first metadata fetch.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      # Every other stateful service here has one; this was the exception, and the consequence is
      # worse than "you lose your test data on a rebuild". The transactional outbox guarantees an
      # event was handed to the broker and marks the row published — so if the broker then loses it
      # before a consumer reads it, nothing republishes it, ever. The payment simply stops
      # advancing, and the outbox correctly reports that it did its job.
      #
      # An ephemeral broker also means consumer offsets do not survive a recreate, so the whole
      # platform silently re-reads or skips depending on auto-offset-reset. For a system whose
      # central claim is a durable event backbone, the backbone should outlive `docker compose up`.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Catches every email the platform sends without a real mail provider or credentials, and shows
  # them at http://localhost:8025. No inbox is real, nothing leaves the machine — the same reason
  # payments run against mock-bank-service rather than a real acquirer.
  mailpit:
    # Holds captured mail in memory for local inspection only.
    mem_limit: 64m
    image: axllent/mailpit:v1.22
    container_name: openpay-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    # Scrapes twelve targets at a short interval; the TSDB is the memory here.
    mem_limit: 384m
    image: prom/prometheus:v3.5.0
    container_name: openpay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    # Renders dashboards, stores nothing itself.
    mem_limit: 192m
    image: grafana/grafana:12.1.1
    container_name: openpay-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local only. The dashboards are read-only anyway, and a login prompt in front of a demo is
      # friction with nothing behind it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisioned, not clicked. Grafana came up empty before this, so every dashboard had to be
      # rebuilt by hand on each fresh volume — which meant nobody did.
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    # Log ingestion, retention kept short in this deployment.
    mem_limit: 256m
    image: grafana/loki:3.5.3
    container_name: openpay-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  # Ships container logs to Loki. Docker service discovery rather than the Loki logging driver,
  # which would have to be installed as a plugin on every machine before anything worked.
  promtail:
    # Tails container logs and forwards; almost stateless.
    mem_limit: 96m
    image: grafana/promtail:3.5.3
    container_name: openpay-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ../observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # Read-only, and the socket is only used for service discovery: promtail asks which
      # containers exist and then reads their log files.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  grafana-data:
  loki-data:
