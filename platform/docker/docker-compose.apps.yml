# The OpenPay services themselves. Infrastructure lives in docker-compose.yml; this file is layered
# on top so the existing "run infra in Docker, services from Maven" workflow still works unchanged.
#
#   docker compose -f platform/docker/docker-compose.yml -f platform/docker/docker-compose.apps.yml up -d --build
#
# Every service is configured entirely through environment variables, which is what makes the same
# jar runnable on a laptop and in a container without a separate profile.

x-service-defaults: &service-defaults
  restart: unless-stopped
  # Without a limit the JVM sizes its heap from the *host's* total RAM, not the container's. Eleven
  # services each believing they may take a quarter of the whole machine is fine on a 32 GB laptop
  # and fatal on an 8 GB VM: they oversubscribe, the kernel starts OOM-killing, and the ones that
  # survive are the ones that happened to allocate slowest. Capping the container is what makes the
  # JVM's own sizing honest — see JAVA_TOOL_OPTIONS below, which is a percentage *of this number*.
  # 512m, and it stays there. Two attempts to shrink it were measured and both were reverted:
  #
  #   384m + 96 MB metaspace — fraud-service died with OutOfMemoryError: Metaspace at startup.
  #                            Spring Boot with JPA, Kafka and Redis loads more classes than that.
  #   448m + a 45% heap      — started fine, and screening went from ~35ms to 93-196ms warm. On a
  #                            path with a 1-second timeout that *fails open*, a 3-5x latency
  #                            regression is not a saving, it is a wider window in which payments
  #                            go unscreened.
  #
  # Memory here is nearly free — it is a ceiling, not a reservation, and an idle service does not
  # touch it. Latency is not free, and it is what this platform is judged on. Where the two are in
  # tension, the RAM stays.
  #
  # Overridable for anyone deliberately squeezing onto a smaller host, with the trade above stated
  # so it is a decision rather than a surprise.
  mem_limit: ${SERVICE_MEM_LIMIT:-512m}
  environment: &common-env
    # 60% of 512m leaves roughly 300 MB of heap with the rest for metaspace, thread stacks, code
    # cache and the JVM itself, which for a Spring Boot service of this size is comfortable.
    #
    # The code cache is deliberately *not* capped. Bounding it looks like free memory and is not:
    # a full code cache makes HotSpot disable the JIT entirely, and a payment path running
    # interpreted is not a slow service, it is a broken one.
    #
    # SerialGC on purpose, and measured rather than assumed. G1 is the better collector in almost
    # every other setting, but it runs several background threads per JVM and eleven JVMs on one
    # small host pay that overhead eleven times over, for heaps this small. Both were benchmarked
    # on the identical four tiers (see tests/performance/baseline.md):
    #
    #                 p50      p95      p99    dropped
    #   SerialGC     31ms    114ms    437ms          0
    #   G1GC         41ms    158ms    301ms         33
    #
    # G1 wins the extreme tail; Serial wins the median, the 95th, and — the one that decides it —
    # sends every request it was asked to. G1 hit the VU ceiling and dropped 33 iterations, which
    # is throughput the platform simply did not get. Revisit this on a host that is not running
    # twelve JVMs at once; the answer is very likely different there.
    JAVA_TOOL_OPTIONS: >-
      -XX:MaxRAMPercentage=${JAVA_HEAP_PERCENT:-60.0}
      -XX:+UseSerialGC
      -Xss512k
      -XX:MaxMetaspaceSize=128m
    DB_HOST: postgres
    # 5432 inside the network. The 5433 on the host is only there to avoid clashing with a local
    # PostgreSQL, and containers should never inherit that workaround.
    DB_PORT: 5432
    DB_USERNAME: openpay
    DB_PASSWORD: openpay
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    OPENPAY_ADMIN_TOKEN: ${OPENPAY_ADMIN_TOKEN:?set OPENPAY_ADMIN_TOKEN before starting the stack}
    # One signing key across the stack: auth-service issues dashboard sessions and the services
    # behind the gateway verify them. HS256 needs at least 32 bytes.
    OPENPAY_JWT_SECRET: ${OPENPAY_JWT_SECRET:?set OPENPAY_JWT_SECRET before starting the stack}
    # Service-to-service calls. Separate from the admin token so a service that reads one thing
    # from a peer does not also hold the credential that opens onboarding and the ledger.
    OPENPAY_INTERNAL_TOKEN: ${OPENPAY_INTERNAL_TOKEN:?set OPENPAY_INTERNAL_TOKEN before starting the stack}
    # Operator reporting/administration that does not mint a credential: the ledger, settlement
    # windows, cross-merchant delivery history. Separate again, so this one is safe to hand to a
    # read-mostly dashboard or a cron job without also handing it merchant onboarding or key issuance.
    OPENPAY_OPS_TOKEN: ${OPENPAY_OPS_TOKEN:?set OPENPAY_OPS_TOKEN before starting the stack}
    # Containers deliver webhooks to real hosts, so the loopback exemption stays off.
    ALLOW_LOOPBACK_WEBHOOKS: "false"
    # Browser origins allowed to call the gateway and auth-service. Required: both refuse every
    # cross-origin request when it is unset, rather than trusting a default nobody chose.
    #
    # Two origins now, not one. The dashboard was the only browser that talked to the platform
    # until the checkout began tokenising cards — and tokenising means the customer's browser
    # posts to the gateway from the shop's origin, which is the whole reason the shop's server
    # never sees a card number. The shop is listed here for that one endpoint's sake; it presents
    # a publishable key, which ApiKeyPrincipal refuses everywhere else.
    OPENPAY_DASHBOARD_ORIGINS: ${OPENPAY_DASHBOARD_ORIGINS:?set OPENPAY_DASHBOARD_ORIGINS before starting the stack}
    # Backs the gateway rate limit and the auth attempt throttle. Both fail open if it is
    # unreachable, so this is a degradation, not an outage.
    REDIS_HOST: redis
    REDIS_PORT: 6379
    AUTH_SERVICE_BASE_URL: http://auth-service:8081
    MERCHANT_SERVICE_BASE_URL: http://merchant-service:8082
    PAYMENT_SERVICE_BASE_URL: http://payment-service:8083
    PROVIDER_ROUTER_BASE_URL: http://provider-router-service:8085
    SETTLEMENT_SERVICE_BASE_URL: http://settlement-service:8087
    NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8088
    FRAUD_SERVICE_BASE_URL: http://fraud-service:8089
    VAULT_SERVICE_BASE_URL: http://vault-service:8091
    # Mailpit: catches outbound email locally instead of talking to a real SMTP provider. Viewable
    # at http://localhost:8025.
    SMTP_HOST: mailpit
    SMTP_PORT: 1025

x-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 40s

services:
  merchant-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/merchant-service
        ARTIFACT: merchant-service
    container_name: openpay-merchant-service
    environment:
      <<: *common-env
      DB_NAME: openpay_merchant
    ports: ["8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]

  auth-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/auth-service
        ARTIFACT: auth-service
    container_name: openpay-auth-service
    environment:
      <<: *common-env
      DB_NAME: openpay_auth
    ports: ["8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      redis: {condition: service_started}
      merchant-service: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]

  payment-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/payment-service
        ARTIFACT: payment-service
    container_name: openpay-payment-service
    environment:
      <<: *common-env
      DB_NAME: openpay_payment
    ports: ["8083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      # Not strictly required — payment-service fails open and records the payment as UNSCREENED —
      # but a stack that comes up with a window of unscreened traffic is a bad default for a demo.
      fraud-service: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]

  webhook-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/webhook-service
        ARTIFACT: webhook-service
    container_name: openpay-webhook-service
    environment:
      <<: *common-env
      DB_NAME: openpay_webhook
      MOCK_BANK_A_SECRET: ${MOCK_BANK_A_SECRET:-bank-a-secret}
      MOCK_BANK_B_SECRET: ${MOCK_BANK_B_SECRET:-bank-b-secret}
    ports: ["8084:8084"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]

  provider-router-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/provider-router-service
        ARTIFACT: provider-router-service
    container_name: openpay-provider-router-service
    environment:
      <<: *common-env
      DB_NAME: openpay_router
      MOCK_BANK_A_URL: http://mock-bank-a:9001
      MOCK_BANK_B_URL: http://mock-bank-b:9002
    ports: ["8085:8085"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]

  ledger-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/ledger-service
        ARTIFACT: ledger-service
    container_name: openpay-ledger-service
    environment:
      <<: *common-env
      DB_NAME: openpay_ledger
    ports: ["8086:8086"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]

  settlement-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/settlement-service
        ARTIFACT: settlement-service
    container_name: openpay-settlement-service
    environment:
      <<: *common-env
      DB_NAME: openpay_settlement
    ports: ["8087:8087"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1"]

  notification-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/notification-service
        ARTIFACT: notification-service
    container_name: openpay-notification-service
    environment:
      <<: *common-env
      DB_NAME: openpay_notification
    ports: ["8088:8088"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      merchant-service: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health || exit 1"]

  fraud-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/fraud-service
        ARTIFACT: fraud-service
    container_name: openpay-fraud-service
    environment:
      <<: *common-env
      DB_NAME: openpay_fraud
    ports: ["8089:8089"]
    depends_on:
      postgres: {condition: service_healthy}
      postgres-databases: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health || exit 1"]

  # The only service that ever sees a card number, and the only one with no database at all.
  # Tokens live in Redis and expire on their own; nothing here is persisted. See VaultApplication
  # for why that boundary is a service rather than a package.
  vault-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/vault-service
        ARTIFACT: vault-service
    container_name: openpay-vault-service
    environment:
      <<: *common-env
    ports: ["8091:8091"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health || exit 1"]

  gateway-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/gateway-service
        ARTIFACT: gateway-service
    container_name: openpay-gateway-service
    environment:
      <<: *common-env
      # Forwarded explicitly so the load-test override documented in tests/performance/README.md
      # actually reaches the process. Without this line, `RATE_LIMIT_PER_WINDOW=10000 docker
      # compose up -d gateway-service` sets the variable on the compose CLI and nowhere else, and
      # a stress run quietly measures the rate limiter instead of the write path behind it.
      RATE_LIMIT_PER_WINDOW: ${RATE_LIMIT_PER_WINDOW:-30}
      # Forwarded for the same reason. Must be true wherever Caddy or another proxy terminates TLS
      # in front of the gateway, or every visitor is bucketed as the proxy and the per-caller
      # tokenisation limit becomes a global one. See docs/DEPLOY.md step 3.
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
    ports: ["8080:8080"]
    depends_on:
      redis: {condition: service_started}
      auth-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      merchant-service: {condition: service_healthy}
      vault-service: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]

  # A static SPA, not a Spring service, so none of the JVM environment applies here. It calls the
  # API from the browser rather than from inside this container, so it needs nothing more than to
  # exist and be reachable — the gateway and auth-service already default to trusting
  # localhost:5173, which is exactly where this is published.
  dashboard:
    restart: unless-stopped
    build:
      context: ../../web/dashboard
      dockerfile: Dockerfile
    container_name: openpay-dashboard
    ports: ["5173:8080"]
    depends_on:
      gateway-service: {condition: service_healthy}
    healthcheck:
      <<: *app-healthcheck
      # 127.0.0.1, not localhost: this alpine image resolves "localhost" to ::1 first, and nginx's
      # `listen` only binds the IPv4 socket, so wget against the hostname fails even though the
      # server is right there. Cost us a full clean-restart test to find. 8080, not 80: the
      # container runs as a non-root user (see the Dockerfile) and binding under 1024 needs a
      # capability it does not have.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]

  # Both acquirers are the same image with different configuration, which is the point: two
  # independently misbehaving endpoints, one codebase.
  mock-bank-a:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/mock-bank-service
        ARTIFACT: mock-bank-service
    container_name: openpay-mock-bank-a
    environment:
      <<: *common-env
      BANK_NAME: mock-bank-a
      BANK_PORT: 9001
      BANK_SIGNING_SECRET: ${MOCK_BANK_A_SECRET:-bank-a-secret}
      WEBHOOK_BASE_URL: http://webhook-service:8084/internal/provider/webhooks
    ports: ["9001:9001"]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:9001/actuator/health || exit 1"]

  mock-bank-b:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/mock-bank-service
        ARTIFACT: mock-bank-service
    container_name: openpay-mock-bank-b
    environment:
      <<: *common-env
      BANK_NAME: mock-bank-b
      BANK_PORT: 9002
      BANK_SIGNING_SECRET: ${MOCK_BANK_B_SECRET:-bank-b-secret}
      WEBHOOK_BASE_URL: http://webhook-service:8084/internal/provider/webhooks
    ports: ["9002:9002"]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:9002/actuator/health || exit 1"]

  # A shop that does not exist, taking payments that really happen.
  #
  # Its only reason to be here is that everything else in this stack demonstrates the platform to
  # someone who already knows what a payment gateway is. This is the one thing you can hand to
  # someone who does not: click Pay, watch the payment reach CAPTURED on its own, then find it in
  # the dashboard.
  #
  # STOREFRONT_API_KEY is empty unless you set it — scripts/seed-demo.sh prints one. The shop says
  # so on its own front page rather than failing with a 401 that reads like the platform is broken.
  # Runs for two seconds, mints the demo merchant's credentials, and exits. Holds the admin token
  # so that the shop does not have to — see platform/docker/demo/provision.sh for why that
  # distinction is the whole point rather than fussiness.
  demo-provisioner:
    profiles: ["shop"]
    image: curlimages/curl:8.11.1
    container_name: openpay-demo-provisioner
    # Root, unlike every long-running service here, which all run as uid 10001. This one exists to
    # write a file into a fresh named volume, and Docker creates those owned by root — so the
    # image's own unprivileged `curl_user` cannot write to it. Normal for an init container: it
    # runs for two seconds, touches one file, and exits. The services that stay up do not.
    user: "0:0"
    environment:
      OPENPAY_ADMIN_TOKEN: ${OPENPAY_ADMIN_TOKEN:?set OPENPAY_ADMIN_TOKEN before starting the stack}
      GATEWAY_BASE_URL: http://gateway-service:8080
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
    volumes:
      - ./demo/provision.sh:/provision.sh:ro
      - demo-credentials:/demo
    entrypoint: ["sh", "/provision.sh"]
    depends_on:
      gateway-service: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    restart: "no"

  demo-storefront:
    <<: *service-defaults
    # Behind a profile, so a plain `up -d` brings up the platform and not the shop. It is not part
    # of the platform: it is a merchant integration, which on a real deployment lives on its own
    # host entirely (docker-compose.storefront.yml, and step 6 of docs/DEPLOY.md). Having it start
    # with everything else quietly says otherwise.
    #
    # `docker compose ... --profile shop up -d` starts the shop and its provisioner together, and
    # that is now all anybody has to do — the credentials it needs are minted by demo-provisioner
    # below and read from a shared volume, rather than pasted in by hand.
    profiles: ["shop"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        MODULE: services/demo-storefront
        ARTIFACT: demo-storefront
    container_name: openpay-demo-storefront
    environment:
      <<: *common-env
      STOREFRONT_PORT: 8090
      # Through the front door, like any merchant: authenticated at the gateway and rate limited
      # there too. Talking straight to payment-service would demo a system nobody runs.
      GATEWAY_BASE_URL: http://gateway-service:8080
      # STOREFRONT_API_KEY and STOREFRONT_PUBLISHABLE_KEY are deliberately absent here, and their
      # absence is load-bearing rather than an oversight.
      #
      # They used to be declared as `${STOREFRONT_API_KEY:-}`, which sets the variable to an empty
      # string when nothing supplies it — and Spring ranks an environment variable above an imported
      # file regardless of whether it has a value. So an unset key did not fall through to what
      # demo-provisioner had written; it silently beat it, and the shop came up reporting that it
      # had no credentials while holding a file containing two. Not declaring them is what lets the
      # import below be the source.
      #
      # To run this shop with keys of your own, use docker-compose.storefront.yml, where both are
      # required and neither can be empty.
      #
      # The page tokenises the card against the gateway itself, so it needs an address a browser can
      # actually resolve — hence localhost here rather than the service name above.
      GATEWAY_PUBLIC_URL: ${STOREFRONT_GATEWAY_PUBLIC_URL:-http://localhost:8080}
      # A browser URL, so localhost — this is rendered into a link the viewer clicks, not called
      # from inside the network.
      DASHBOARD_URL: ${STOREFRONT_DASHBOARD_URL:-http://localhost:5173}
      # Reads whatever demo-provisioner wrote. `optional:` so that setting the keys by hand still
      # works and a missing file is not a startup failure — the shop already says on its own front
      # page when it has no key, which is a far better error than a stack trace.
      #
      # The env vars above still win where they are set: Spring ranks environment variables above
      # an imported file, so a real deployment passing real keys is unaffected by this existing.
      SPRING_CONFIG_IMPORT: optional:file:/demo/demo.properties
    volumes:
      - demo-credentials:/demo:ro
    ports: ["8090:8090"]
    depends_on:
      gateway-service: {condition: service_healthy}
      # Waits for the provisioner to have finished, not merely started. Spring reads its
      # configuration once at boot, so a credentials file that appears a second later would be
      # invisible until the next restart.
      demo-provisioner: {condition: service_completed_successfully}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health || exit 1"]

  # TLS termination at the edge, matching platform/k8s/40-ingress.yaml's four-host split exactly.
  # Nothing behind it changes: gateway-service, auth-service, webhook-service, and dashboard stay
  # on plain HTTP, unaware anything is proxying them. See platform/docker/caddy/Caddyfile and
  # SECURITY-AUDIT.md finding 12.
  caddy:
    image: caddy:2.9-alpine
    container_name: openpay-caddy
    restart: unless-stopped
    ports:
      - "8443:8443"   # https, proxies to gateway-service (merchant API traffic)
      - "8444:8444"   # https, proxies to auth-service, login only
      - "8445:8445"   # https, proxies to webhook-service (acquirer callbacks)
      - "5443:5443"   # https, proxies to the dashboard
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's self-signed local CA persists here across restarts, so the browser only has to
      # trust it once rather than on every `docker compose up`.
      - caddy-data:/data
    depends_on:
      gateway-service: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      webhook-service: {condition: service_healthy}
      dashboard: {condition: service_healthy}

volumes:
  # The demo merchant's credentials, written once by demo-provisioner and read by the shop. A named
  # volume rather than a bind mount so the file never lands in the working tree, where a real API
  # key would be one `git add -A` away from being published.
  demo-credentials:
  caddy-data:
