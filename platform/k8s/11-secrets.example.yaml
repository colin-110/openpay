# A template, not a Secret you should apply.
#
# Every value below is a placeholder. Committing real ones would put the credential that mints API
# keys into git history, where it stays after any rotation. Generate them and create the Secret out
# of band:
#
#   kubectl -n openpay create secret generic openpay-secrets \
#     --from-literal=OPENPAY_ADMIN_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=OPENPAY_OPS_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=OPENPAY_INTERNAL_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=OPENPAY_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=MOCK_BANK_A_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MOCK_BANK_B_SECRET="$(openssl rand -hex 32)"
#
# Four distinct tokens on purpose, not one repeated four times. The whole point of the tiers is that
# leaking the credential embedded in a reporting dashboard does not also leak the one that onboards
# merchants — which is exactly what reusing a value here would undo.
#
# None of these has a default in the application either: an unset token means the paths behind it
# are refused, rather than open. A deployment that forgets one fails closed and says so.
#
# In a real cluster this comes from a secret manager — External Secrets, Sealed Secrets, or the
# cloud provider's CSI driver — and not from a file at all.

apiVersion: v1
kind: Secret
metadata:
  name: openpay-secrets
  namespace: openpay
type: Opaque
stringData:
  # Creates a business identity or a credential that can move money: onboarding, key issuance,
  # dashboard users, webhook secret rotation, and editing the fraud and routing rules.
  OPENPAY_ADMIN_TOKEN: replace-me-admin

  # Operator reporting and administration that mints nothing: the ledger, settlement windows,
  # cross-merchant delivery history, the review queue, dead-letter replay, the audit log.
  OPENPAY_OPS_TOKEN: replace-me-ops

  # Service-to-service calls. The narrowest tier.
  OPENPAY_INTERNAL_TOKEN: replace-me-internal

  # HS256 signing key for dashboard sessions. auth-service refuses to start under 32 bytes.
  OPENPAY_JWT_SECRET: replace-me-with-at-least-32-bytes-of-key

  DB_PASSWORD: replace-me-db

  # Shared with the simulated acquirers so webhook-service can verify what they send.
  MOCK_BANK_A_SECRET: replace-me-bank-a
  MOCK_BANK_B_SECRET: replace-me-bank-b
