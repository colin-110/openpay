# What is reachable from outside the cluster, and nothing else.
#
# Four hosts, and the split matters more than the routing does:
#
#   dashboard  -> the static merchant console. The one thing a human types into a browser bar.
#   api        -> gateway-service. Merchant traffic. Everything behind it is authenticated by an
#                 API key or a dashboard session.
#   auth       -> auth-service, and only /api/v1/auth/{login,refresh,logout}. None of the three can
#                 go through the gateway, which authenticates every request it proxies — a person
#                 signing in has no credential yet, and a refresh/logout token is not an API key or
#                 a session, so the gateway would not know what to do with it either.
#   webhooks   -> webhook-service. Acquirer callbacks. Signature-verified, deduplicated, and the
#                 only path an external party that is not a merchant can reach.
#
# Every other service is deliberately absent. The ledger, the review queue, settlement runs, the
# routing table, the audit log, and dead-letter replay are all operator surfaces; they are reached
# through the cluster (kubectl port-forward, or an internal-only ingress), not published to the
# internet with a shared token in front of them.
#
# TLS is terminated here rather than in application code. The audit accepted that as the right
# place for it; these annotations assume cert-manager, and the class assumes ingress-nginx.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openpay
  namespace: openpay
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # The platform's own rate limiter is per API key and lives in the gateway. This one is per
    # source address and sits in front of it: they catch different things, and neither replaces
    # the other.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    # Required for the auth host's path below, which matches one of three literal alternatives
    # rather than a prefix. Without this, ingress-nginx treats the regex as a literal string and
    # the route never matches anything.
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.openpay.example
        - api.openpay.example
        - auth.openpay.example
        - webhooks.openpay.example
      secretName: openpay-tls
  rules:
    - host: dashboard.openpay.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port: { number: 80 }

    - host: api.openpay.example
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port: { number: 8080 }

    - host: auth.openpay.example
      http:
        paths:
          # Exactly these three. auth-service also issues API keys and creates dashboard users, and
          # those live behind the admin token — but publishing the whole service would put them one
          # guessed token away from the internet rather than inside the cluster. ImplementationSpecific
          # is nginx's own regex path type; the others (Exact/Prefix) cannot express "one of these
          # three literal paths" without three separate rules repeating the same backend.
          - path: /api/v1/auth/(login|refresh|logout)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port: { number: 8081 }

    - host: webhooks.openpay.example
      http:
        paths:
          - path: /internal/provider/webhooks
            pathType: Prefix
            backend:
              service:
                name: webhook-service
                port: { number: 8084 }
