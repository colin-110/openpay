# The OpenPay services.
#
# Every one of them is the same shape, because they are configured identically: environment
# variables from one ConfigMap and one Secret, actuator liveness and readiness probes, and a
# non-root security context. The differences that do exist -- a database name, an extra secret --
# are small and visible.
#
# Images are referenced as openpay/<service>:${TAG}. Set TAG with kustomize or your deployment
# tool; there is deliberately no `latest` here, because a tag that moves makes a rollback a guess.
#
# Two things are worth reading rather than skimming:
#
#   * readiness hits /actuator/health/readiness, not /actuator/health. A service's aggregate health
#     includes its dependencies, so using it would take a pod out of rotation because something
#     downstream is unwell -- turning one service's outage into everyone's.
#
#   * every pod runs unprivileged with a read-only root filesystem. A payment service that gets
#     compromised should not also be root, and should not be able to write itself a new binary.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: openpay
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: openpay
spec:
  # The front door. Two replicas, because it is the one thing a merchant talks to directly and
  # a rolling restart of a single replica is a visible outage.
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer pods than requested during a deploy. Surge first, then retire the old
      # one, so a rollout of a single-replica service is not a gap in service.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-service
          image: openpay/gateway-service:${TAG}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: openpay-config }
            - secretRef: { name: openpay-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only and the JVM still needs somewhere to put
            # temporary files. An emptyDir is that somewhere.
            - name: tmp
              mountPath: /tmp
          startupProbe:
            # Generous, and separate from liveness on purpose. A service applying Flyway
            # migrations to a cold database takes far longer to start than it ever takes to
            # answer once it is up; one probe for both would either kill it mid-migration or
            # take a minute to notice it had hung.
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            # No CPU limit. Throttling a JVM under one shows up as latency with no other
            # symptom; the request is what the scheduler actually needs, and memory is the
            # resource where a limit genuinely protects the node.
            limits: { memory: 1Gi }
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: openpay
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http

