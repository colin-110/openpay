---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: openpay
  labels:
    app: fraud-service
    app.kubernetes.io/part-of: openpay
spec:
  # Two replicas: this sits in the write path of every payment, and payment-service fails open
  # when it cannot be reached -- so an unavailable fraud-service means unscreened traffic.
  replicas: 2
  selector:
    matchLabels:
      app: fraud-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer pods than requested during a deploy. Surge first, then retire the old
      # one, so a rollout of a single-replica service is not a gap in service.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fraud-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fraud-service
          image: openpay/fraud-service:${TAG}
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef: { name: openpay-config }
            - secretRef: { name: openpay-secrets }
          env:
            - name: DB_NAME
              value: openpay_fraud
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only and the JVM still needs somewhere to put
            # temporary files. An emptyDir is that somewhere.
            - name: tmp
              mountPath: /tmp
          startupProbe:
            # Generous, and separate from liveness on purpose. A service applying Flyway
            # migrations to a cold database takes far longer to start than it ever takes to
            # answer once it is up; one probe for both would either kill it mid-migration or
            # take a minute to notice it had hung.
            httpGet: { path: /actuator/health/liveness, port: 8089 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8089 }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8089 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            # No CPU limit. Throttling a JVM under one shows up as latency with no other
            # symptom; the request is what the scheduler actually needs, and memory is the
            # resource where a limit genuinely protects the node.
            limits: { memory: 1Gi }
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: openpay
  labels:
    app: fraud-service
spec:
  selector:
    app: fraud-service
  ports:
    - port: 8089
      targetPort: 8089
      name: http

# Both simulated acquirers are the same image with different configuration. That is the point:
# two independently misbehaving endpoints from one codebase, so failover has something real to
# fail over between.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-bank-a
  namespace: openpay
  labels:
    app: mock-bank-a
    app.kubernetes.io/part-of: openpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-bank-a
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer pods than requested during a deploy. Surge first, then retire the old
      # one, so a rollout of a single-replica service is not a gap in service.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mock-bank-a
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-bank-a
          image: openpay/mock-bank-service:${TAG}
          ports:
            - containerPort: 9001
          envFrom:
            - configMapRef: { name: openpay-config }
            - secretRef: { name: openpay-secrets }
          env:
            - name: BANK_SIGNING_SECRET
              valueFrom:
                secretKeyRef: { name: openpay-secrets, key: MOCK_BANK_A_SECRET }
            - name: BANK_NAME
              value: "mock-bank-a"
            - name: BANK_PORT
              value: "9001"
            - name: WEBHOOK_BASE_URL
              value: "http://webhook-service:8084/internal/provider/webhooks"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only and the JVM still needs somewhere to put
