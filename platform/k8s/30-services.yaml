  name: provider-router-service
  namespace: openpay
  labels:
    app: provider-router-service
    app.kubernetes.io/part-of: openpay
spec:
  # Deliberately one replica. Circuit breaker state is in memory per instance, so a second
  # replica has its own view of which acquirers are unhealthy and has to learn it separately.
  # Sharing that state is real work and has not been done.
  replicas: 1
  selector:
    matchLabels:
      app: provider-router-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer pods than requested during a deploy. Surge first, then retire the old
