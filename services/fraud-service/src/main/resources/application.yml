spring:
  application:
    name: fraud-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Same short timeouts as auth-service and gateway-service, and for the same reason: Lettuce
      # defaults to a 60-second command timeout, which would turn "fall back to counting in
      # PostgreSQL" into "hang for a minute, then fall back".
      timeout: 250ms
      connect-timeout: 250ms
  datasource:
    # pgjdbc parses and plans a statement afresh until it has seen it prepareThreshold
    # times (default 5), then switches to a server-side prepared statement. Every query
    # this platform runs is one of a small fixed set, so there is nothing to be gained by
    # waiting - promote on first use and keep a larger cache per connection.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_fraud}?prepareThreshold=1&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
    hikari:
      # Sized per service rather than left on HikariCP's default of 10. Nine services share
      # one PostgreSQL, so these ceilings are chosen against its max_connections (200, set in
      # docker-compose.yml) with room for every pool to burst at once.
      maximum-pool-size: 20
      # HikariCP opens minimum-idle connections eagerly and defaults it to maximum-pool-size,
      # which is why this stack once sat at 96 of 100 connections while doing nothing at all.
      # Most services therefore rest at 2 and grow on demand.
      #
      # This one rests higher because screening is a *synchronous* call inside the merchant's
      # request, with a 1s read timeout and fail-open behaviour — so a cold pool does not merely
      # make the first payment slow, it makes the first payment come back UNSCREENED. Measured:
      # the very first payment through a freshly started stack timed out and failed open, while
      # every payment after it screened in 37ms. A demo whose first payment reads "nobody looked
      # at this" is a bad advertisement for the risk engine, and more importantly it is a real
      # window in which rules are not being applied.
      minimum-idle: 6
      # Return a connection to the pool rather than holding it open forever, so a service that
      # goes quiet gives its connections back to the ones that are busy.
      idle-timeout: 60000
      max-lifetime: 900000
      # Fail fast instead of queueing behind an exhausted pool for the default 30 seconds.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # A payment writes three rows — the payment, its event, and its outbox row — and without
          # batching each is its own round trip to PostgreSQL. Batching sends them together.
          batch_size: 30
        # Both are required for batching to actually happen: Hibernate will not batch inserts it
        # has interleaved with updates, and order_inserts groups them by table first.
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: fraud-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

openpay:
  outbox:
    relay-enabled: true
    poll-interval-ms: 500
  fraud:
    review-page-size: ${FRAUD_REVIEW_PAGE_SIZE:100}
  security:
    # Three tiers on three prefixes. The gate is service-to-service; the queue is operator work;
    # editing a rule changes standing policy and sits with the credential-minting actions.
    internal-token: ${OPENPAY_INTERNAL_TOKEN:}
    internal-paths:
      - /internal/fraud/checks
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /internal/fraud/reviews
      - /internal/fraud/decisions
    admin-token: ${OPENPAY_ADMIN_TOKEN:}
    admin-paths:
      - /internal/fraud/rules

server:
  tomcat:
    # Tomcat's default is 200. With a database pool of far fewer, the surplus threads
    # cannot do anything except queue for a connection — they add context switching and
    # hide backpressure, turning "the database is saturated" into "everything is slow".
    # Sized just above the pool so there is room to accept and hand off, not to pile up.
    threads:
      max: 50
  port: 8089
  shutdown: graceful

management:
  health:
    redis:
      # Redis is an accelerator here, not a dependency: velocity counting falls back to exact
      # PostgreSQL counts when it is unreachable, so an outage costs latency and nothing else.
      # Left enabled, the auto-configured indicator marks this service DOWN, its container fails
      # its healthcheck, and everything depending on fraud-service refuses to start — turning a
      # graceful degradation into exactly the outage the fallback exists to prevent.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
