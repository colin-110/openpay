spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_payment}
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

openpay:
  security:
    auth-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
    # Every payment path requires a valid merchant API key. Merchant identity comes from the
    # validated key, never from a client-supplied header.
    api-key-paths:
      - /api/v1/payments

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
