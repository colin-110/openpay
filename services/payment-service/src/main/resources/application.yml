spring:
  application:
    name: payment-service
  datasource:
    # pgjdbc parses and plans a statement afresh until it has seen it prepareThreshold
    # times (default 5), then switches to a server-side prepared statement. Every query
    # this platform runs is one of a small fixed set, so there is nothing to be gained by
    # waiting - promote on first use and keep a larger cache per connection.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_payment}?prepareThreshold=1&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
    hikari:
      # Sized per service rather than left on HikariCP's default of 10. Nine services share
      # one PostgreSQL, so these ceilings are chosen against its max_connections (200, set in
      # docker-compose.yml) with room for every pool to burst at once.
      maximum-pool-size: 25
      # HikariCP opens minimum-idle connections eagerly and defaults it to maximum-pool-size,
      # which is why this stack once sat at 96 of 100 connections while doing nothing at all.
      # Most services therefore rest at 2 and grow on demand.
      #
      # The write path rests higher, for the same reason auth-service does: growing the pool from
      # cold happens exactly when a burst arrives, and the requests that pay for it are the ones
      # at the front of that burst. Six is enough to absorb a normal ramp without holding
      # connections nine other services could be using.
      minimum-idle: 6
      # Return a connection to the pool rather than holding it open forever, so a service that
      # goes quiet gives its connections back to the ones that are busy.
      idle-timeout: 60000
      max-lifetime: 900000
      # Fail fast instead of queueing behind an exhausted pool for the default 30 seconds.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # A payment writes three rows — the payment, its event, and its outbox row — and without
          # batching each is its own round trip to PostgreSQL. Batching sends them together.
          batch_size: 30
        # Both are required for batching to actually happen: Hibernate will not batch inserts it
        # has interleaved with updates, and order_inserts groups them by table first.
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for all in-sync replicas: an outbox row is only marked published once the broker
      # has durably accepted it.
      acks: all
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    deserialization:
      # Amounts are integer minor units. Jackson would otherwise quietly truncate a fractional
      # amount, so "10.99" would be accepted and charged as 10. Reject it as a client error instead.
      accept-float-as-int: false

openpay:
  dlq:
    # The replay tool, on this service because these are the topics it consumes and therefore the
    # dead letters it produces. The list is an allowlist: replay publishes to a topic derived from
    # the request, so accepting an arbitrary one would let the ops token inject any event anywhere.
    enabled: ${OPENPAY_DLQ_REPLAY_ENABLED:true}
    topics:
      - payment.provider-dispatched.v1
      - provider.callback-received.v1
      - refund.callback-received.v1
      - fraud.check-completed.v1
  router:
    # Read-only, and only when a merchant opens one payment: the router owns its attempt history
    # and this service asks rather than keeping a second copy of it.
    base-url: ${PROVIDER_ROUTER_BASE_URL:http://localhost:8085}
  vault:
    # Where a payment token is spent. Unlike the fraud gate below, this call does not fail open:
    # a vault that cannot be reached means the instrument behind a token is unknown, and accepting
    # the caller's own description of it instead is exactly what redeeming the token prevents.
    base-url: ${VAULT_SERVICE_BASE_URL:http://localhost:8091}
  fraud:
    base-url: ${FRAUD_SERVICE_BASE_URL:http://localhost:8089}
    # What to do when screening cannot be reached. Open by default: refusing every payment on the
    # platform because the risk service is unhealthy is a larger, self-inflicted outage than the
    # losses it would prevent. Payments that go through this way are recorded as UNSCREENED rather
    # than ALLOWED, so the window is visible afterwards. Set false to stop taking payments instead.
    fail-open: ${FRAUD_FAIL_OPEN:true}
    # Screen before the response (false) or after it (true).
    #
    # Synchronous is the default and the stronger contract: a payment the rules refuse is never
    # persisted and the merchant is told 422 immediately. Asynchronous returns 201 as soon as the
    # payment is durable and screens afterwards, which takes a network round trip out of the
    # merchant's request at the cost of a refusal arriving after the acknowledgement. Both keep
    # the property that matters — nothing reaches an acquirer until screening has allowed it.
    async: ${FRAUD_ASYNC:false}
    # Only read when async is on. How long a payment may wait for a screening answer before it is
    # treated as stalled, re-requested, and counted in openpay_payments_awaiting_screening. Two
    # minutes is far longer than screening takes and short enough to alert on within an incident.
    async-deadline: ${FRAUD_ASYNC_DEADLINE:PT2M}
    async-sweep-ms: ${FRAUD_ASYNC_SWEEP_MS:30000}
    async-sweep-batch: 100
  outbox:
    relay-enabled: true
    poll-interval-ms: 500
    batch-size: 100
  security:
    # Presented to provider-router-service when reading attempt history. Deliberately not the
    # admin token: this service needs one read from a peer, not the keys to the platform.
    internal-token: ${OPENPAY_INTERNAL_TOKEN:}
    # Same key auth-service signs with, so a dashboard session is accepted wherever an API key is.
    jwt-secret: ${OPENPAY_JWT_SECRET:}
    auth-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
    # Every payment path requires a valid merchant API key. Merchant identity comes from the
    # validated key, never from a client-supplied header.
    api-key-paths:
      - /api/v1/payments
      - /api/v1/refunds
    # Replaying a dead letter puts a message back into the payment flow. It mints no credential,
    # so it sits with the ledger and settlement runs on the ops tier rather than the admin tier.
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /internal/dlq

server:
  tomcat:
    # Tomcat's default is 200. With a database pool of far fewer, the surplus threads
    # cannot do anything except queue for a connection — they add context switching and
    # hide backpressure, turning "the database is saturated" into "everything is slow".
    # Sized just above the pool so there is room to accept and hand off, not to pile up.
    threads:
      max: 60
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
