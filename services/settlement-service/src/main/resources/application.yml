spring:
  application:
    name: settlement-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_settlement}
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
    hikari:
      # Sized per service rather than left on HikariCP's default of 10. Nine services share
      # one PostgreSQL, so these ceilings are chosen against its max_connections (200, set in
      # docker-compose.yml) with room for every pool to burst at once.
      maximum-pool-size: 8
      # The important one. HikariCP opens minimum-idle connections eagerly and defaults it to
      # maximum-pool-size, which is why this stack sat at 96 of 100 connections while doing
      # nothing at all. Two per service at rest, growing on demand.
      minimum-idle: 2
      # Return a connection to the pool rather than holding it open forever, so a service that
      # goes quiet gives its connections back to the ones that are busy.
      idle-timeout: 60000
      max-lifetime: 900000
      # Fail fast instead of queueing behind an exhausted pool for the default 30 seconds.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: settlement-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

openpay:
  dlq:
    # The replay tool, on this service because these are the topics it consumes and therefore the
    # dead letters it produces. The list is an allowlist: replay publishes to a topic derived from
    # the request, so accepting an arbitrary one would let the ops token inject any event anywhere.
    enabled: ${OPENPAY_DLQ_REPLAY_ENABLED:true}
    topics:
      - payment.status-updated.v1
      - refund.succeeded.v1
  outbox:
    relay-enabled: true
    poll-interval-ms: 500
  settlement:
    # 2.00% of gross. A flat fee is supported but defaults to zero, because a non-zero one makes
    # small payments net negative and this phase has no carry-forward policy.
    fee-basis-points: ${SETTLEMENT_FEE_BPS:200}
    fee-fixed-minor: ${SETTLEMENT_FEE_FIXED:0}
    # Zero locally so a demo settles immediately. A real deployment holds captured funds until the
    # acquirer's reversal window has closed.
    hold-period: ${SETTLEMENT_HOLD_PERIOD:0s}
    scheduled: ${SETTLEMENT_SCHEDULED:true}
    cron: ${SETTLEMENT_CRON:0 0 2 * * *}
  security:
    # A merchant reads its own payouts; only an operator closes a window or marks one complete.
    # The two live on different prefixes so one authentication rule can cover each cleanly.
    jwt-secret: ${OPENPAY_JWT_SECRET:}
    auth-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
    api-key-paths:
      - /api/v1/settlements
    # Closing a window or marking a payout complete does not mint a credential — it processes
    # payments that were already captured and already owed — so it sits on the ops tier rather
    # than the admin tier.
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /internal/settlements
      - /internal/dlq

server:
  port: 8087
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
