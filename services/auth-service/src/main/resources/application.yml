spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_auth}
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce's own default is 60 seconds — found by actually pausing Redis and watching the
      # attempt limiter hang for a full minute per call before its already-correct fail-open
      # catch block ever ran. ValidationAttemptLimiter catching DataAccessException was never
      # the gap; a caller waiting a minute for that catch block to fire is functionally an
      # outage regardless of what happens after it. Short enough that fail-open reads as
      # instant, long enough not to trip on ordinary jitter to a colocated container.
      timeout: 250ms
      connect-timeout: 250ms
  mail:
    # Same property MailSenderAutoConfiguration itself reads — see common-email. Defaults to the
    # local Mailpit container in compose; a real deployment points this at a real relay.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000

openpay:
  email:
    from: ${OPENPAY_EMAIL_FROM:security@openpay.local}
  merchant:
    base-url: ${MERCHANT_SERVICE_BASE_URL:http://localhost:8082}
  jwt:
    # No default: HS256 with a weak or shared-by-accident key means forgeable sessions.
    secret: ${OPENPAY_JWT_SECRET:}
    # Short on purpose, and only safe because it is short: the dashboard renews this silently a
    # minute before it lapses, using the refresh token below, so nobody notices. What a shorter
    # access token buys is a tighter window on a stolen one — fifteen minutes of use rather than
    # an hour, with no cost to a legitimate session that keeps renewing.
    ttl: ${OPENPAY_JWT_TTL:PT15M}
    issuer: openpay
    # How long a refresh token is good for before it must be a fresh login rather than a renewal.
    # Rotated on every use — see RefreshToken.rotateTo — so this bounds how long a session can
    # continue being silently renewed, not how long any single token is valid for.
    refresh-ttl: ${OPENPAY_JWT_REFRESH_TTL:P30D}
  security:
    # Login is called by the dashboard directly rather than through the gateway, so this service
    # answers cross-origin requests too. Empty by default, so a deployment that forgets to name
    # its origin answers none at all rather than silently trusting a developer's laptop.
    # scripts/run-local.ps1 sets it for local work.
    allowed-origins: ${OPENPAY_DASHBOARD_ORIGINS:}
    # Issuing a credential is a platform-operator action. Empty by default: a shipped default
    # would be a publicly known secret, so admin paths fail closed until this is set.
    admin-token: ${OPENPAY_ADMIN_TOKEN:}
    admin-paths:
      - /api/v1/api-keys
      # Creating dashboard users is operator-only. /api/v1/auth/login is deliberately absent:
      # it is the entry point for humans and cannot require a credential they do not have.
      - /api/v1/users
    # Reading the audit log sits on the operator tier, not the admin tier: investigating an
    # incident should not require holding the credential that could cause one.
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /internal/audit
  auth:
    max-failed-validations: 20
    failed-validation-window: PT1M
    # Two budgets on login. Per-account is tight, because a person retrying their own password a
    # dozen times in fifteen minutes has already stopped guessing. Per-source is much looser: a
    # shared office IP or a NAT gateway legitimately produces many failures from many people, and
    # setting it near the per-account number would lock out a whole building.
    max-failed-logins: ${MAX_FAILED_LOGINS:10}
    max-failed-logins-per-source: ${MAX_FAILED_LOGINS_PER_SOURCE:50}
    failed-login-window: ${FAILED_LOGIN_WINDOW:PT15M}
    last-used-refresh-interval: PT5M

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The attempt limiter fails open on a Redis outage rather than blocking logins, so losing
    # Redis degrades throttling, not the ability to sign in. Reporting auth-service as DOWN for
    # that would be a false alarm.
    redis:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
