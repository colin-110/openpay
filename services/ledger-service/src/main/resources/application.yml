spring:
  application:
    name: ledger-service
  datasource:
    # pgjdbc parses and plans a statement afresh until it has seen it prepareThreshold
    # times (default 5), then switches to a server-side prepared statement. Every query
    # this platform runs is one of a small fixed set, so there is nothing to be gained by
    # waiting - promote on first use and keep a larger cache per connection.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_ledger}?prepareThreshold=1&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
    hikari:
      # Sized per service rather than left on HikariCP's default of 10. Nine services share
      # one PostgreSQL, so these ceilings are chosen against its max_connections (200, set in
      # docker-compose.yml) with room for every pool to burst at once.
      maximum-pool-size: 10
      # The important one. HikariCP opens minimum-idle connections eagerly and defaults it to
      # maximum-pool-size, which is why this stack sat at 96 of 100 connections while doing
      # nothing at all. Two per service at rest, growing on demand.
      minimum-idle: 2
      # Return a connection to the pool rather than holding it open forever, so a service that
      # goes quiet gives its connections back to the ones that are busy.
      idle-timeout: 60000
      max-lifetime: 900000
      # Fail fast instead of queueing behind an exhausted pool for the default 30 seconds.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # A payment writes three rows — the payment, its event, and its outbox row — and without
          # batching each is its own round trip to PostgreSQL. Batching sends them together.
          batch_size: 30
        # Both are required for batching to actually happen: Hibernate will not batch inserts it
        # has interleaved with updates, and order_inserts groups them by table first.
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

openpay:
  dlq:
    # The replay tool, on this service because these are the topics it consumes and therefore the
    # dead letters it produces. The list is an allowlist: replay publishes to a topic derived from
    # the request, so accepting an arbitrary one would let the ops token inject any event anywhere.
    enabled: ${OPENPAY_DLQ_REPLAY_ENABLED:true}
    topics:
      - payment.status-updated.v1
      - refund.succeeded.v1
      - settlement.created.v1
  security:
    # The books are platform-operator data, not merchant-facing. Read-only, so it sits on the ops
    # tier rather than the admin tier: this credential can be handed to a finance dashboard without
    # also handing it the power to onboard a merchant or mint an API key.
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /api/v1/ledger
      # Replaying a dead letter puts a message back into the payment flow. It mints no credential,
      # so it sits on the same tier as reading the books.
      - /internal/dlq

server:
  tomcat:
    # Tomcat's default is 200. With a database pool of far fewer, the surplus threads
    # cannot do anything except queue for a connection — they add context switching and
    # hide backpressure, turning "the database is saturated" into "everything is slow".
    # Sized just above the pool so there is room to accept and hand off, not to pile up.
    threads:
      max: 30
  port: 8086
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
