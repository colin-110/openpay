spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_notification}
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  mail:
    # Same property MailSenderAutoConfiguration itself reads — see common-email. Defaults to the
    # local Mailpit container in compose; a real deployment points this at a real relay.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000

openpay:
  email:
    from: ${OPENPAY_EMAIL_FROM:ops@openpay.local}
  dlq:
    # The replay tool, on this service because these are the topics it consumes and therefore the
    # dead letters it produces. The list is an allowlist: replay publishes to a topic derived from
    # the request, so accepting an arbitrary one would let the ops token inject any event anywhere.
    enabled: ${OPENPAY_DLQ_REPLAY_ENABLED:true}
    topics:
      - payment.status-updated.v1
      - refund.succeeded.v1
  notification:
    merchant-base-url: ${MERCHANT_SERVICE_BASE_URL:http://localhost:8082}
    # Used to read a merchant's delivery configuration, which includes their signing secret. The
    # service token, not the admin token: this service makes outbound calls to merchant-controlled
    # URLs, so it should hold as little platform-wide authority as possible.
    internal-token: ${OPENPAY_INTERNAL_TOKEN:}
    # Delivering to loopback is refused unless this is on: in development the only reachable test
    # endpoint is on this machine, everywhere else it would mean the platform calling itself.
    allow-loopback-targets: ${ALLOW_LOOPBACK_WEBHOOKS:true}
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:8}
    initial-backoff: ${WEBHOOK_INITIAL_BACKOFF:5s}
    max-backoff: ${WEBHOOK_MAX_BACKOFF:6h}
    # Merchant endpoints are outside our control, so both timeouts are short and enforced.
    connect-timeout: 3s
    read-timeout: 5s
    batch-size: 50
    poll-interval-ms: 1000
    # Where the "a merchant's endpoint gave up" alert goes. Empty by default — an address nobody
    # configured would just mean every abandoned delivery quietly fails to notify anyone twice
    # over, so this stays off rather than emailing a dead address until it is set.
    ops-email: ${OPENPAY_OPS_EMAIL:}
  security:
    # A merchant sees its own delivery history, scoped by its credential. The cross-merchant view
    # is operator-only and sits on /internal, where a query parameter cannot widen the scope.
    jwt-secret: ${OPENPAY_JWT_SECRET:}
    auth-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
    api-key-paths:
      - /api/v1/webhooks
    # A read of delivery history, not an action that mints a credential, so it sits on the ops
    # tier rather than the admin tier.
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /internal/webhooks
      - /internal/dlq

server:
  port: 8088
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
