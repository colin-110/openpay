spring:
  application:
    name: webhook-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_webhook}
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
    hikari:
      # Sized per service rather than left on HikariCP's default of 10. Nine services share
      # one PostgreSQL, so these ceilings are chosen against its max_connections (200, set in
      # docker-compose.yml) with room for every pool to burst at once.
      maximum-pool-size: 15
      # The important one. HikariCP opens minimum-idle connections eagerly and defaults it to
      # maximum-pool-size, which is why this stack sat at 96 of 100 connections while doing
      # nothing at all. Two per service at rest, growing on demand.
      minimum-idle: 2
      # Return a connection to the pool rather than holding it open forever, so a service that
      # goes quiet gives its connections back to the ones that are busy.
      idle-timeout: 60000
      max-lifetime: 900000
      # Fail fast instead of queueing behind an exhausted pool for the default 30 seconds.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

openpay:
  webhook:
    # How far a callback's clock may be from ours. Long enough to absorb ordinary drift and a slow
    # retry, short enough that a captured callback is worthless almost immediately.
    tolerance: ${WEBHOOK_TOLERANCE:5m}
    signing-secrets:
      # Must match each bank's BANK_SIGNING_SECRET. A provider with no secret here is refused.
      mock-bank-a: ${MOCK_BANK_A_SECRET:}
      mock-bank-b: ${MOCK_BANK_B_SECRET:}

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
