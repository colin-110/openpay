spring:
  application:
    name: merchant-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_merchant}
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

openpay:
  merchant:
    # Local development points webhooks at localhost, which the delivery policy exists to refuse.
    # A deployment leaves this false so a merchant cannot aim the platform at its own network.
    allow-loopback-webhooks: ${ALLOW_LOOPBACK_WEBHOOKS:true}
  security:
    # Merchant onboarding and key-affecting actions are platform-operator actions, not
    # merchant-facing ones.
    admin-token: ${OPENPAY_ADMIN_TOKEN:}
    admin-paths:
      - /api/v1/merchants
    # notification-service reads a merchant's live webhook secret on every delivery attempt. A
    # credential scoped to exactly that read, rather than the admin token, so the most externally
    # exposed service does not also hold the keys to onboarding and key issuance.
    internal-token: ${OPENPAY_INTERNAL_TOKEN:}
    internal-paths:
      - /internal/merchants
    # Reading this service's audit log, on the operator tier: investigating an onboarding should
    # not require holding the credential that could perform one.
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /internal/audit

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
