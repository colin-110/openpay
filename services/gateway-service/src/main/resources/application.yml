spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # See auth-service's application.yml for why this is set explicitly: Lettuce's own default
      # is 60 seconds, which turns "the rate limiter fails open" into "the rate limiter hangs for
      # a minute and then fails open" — found by pausing the Redis container and watching it
      # happen, not by reading the code.
      timeout: 250ms
      connect-timeout: 250ms

openpay:
  rate-limit:
    # Mutating requests one merchant may make per window. Generous for a demo; a real deployment
    # tunes both numbers to its own traffic.
    enabled: ${RATE_LIMIT_ENABLED:true}
    limit: ${RATE_LIMIT_PER_WINDOW:30}
    window: ${RATE_LIMIT_WINDOW:5s}
  security:
    auth-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
    # Same key auth-service signs with, so a dashboard session is accepted wherever an API key is.
    jwt-secret: ${OPENPAY_JWT_SECRET:}
    # The dashboard is a browser application on a different origin. Empty by default, so a
    # deployment that forgets to name its origin answers no cross-origin request at all rather
    # than silently trusting a developer's laptop. scripts/run-local.ps1 sets it for local work.
    allowed-origins: ${OPENPAY_DASHBOARD_ORIGINS:}
    # Merchant-facing paths the gateway authenticates before forwarding. Merchant admin paths are
    # deliberately absent: they use the admin token, which merchant-service checks itself.
    api-key-paths:
      - /api/v1/payments
      - /api/v1/refunds
      - /api/v1/settlements
      - /api/v1/webhooks
      - /api/v1/protected
      # Authenticated like the rest, but the key presented here is usually the publishable one,
      # which is readable by anyone who opens the checkout page. What keeps that safe is not this
      # list but ApiKeyPrincipal: a publishable key carries tokens:create, which is refused by
      # requireRead and requireWrite everywhere else on the platform.
      - /api/v1/tokens
  gateway:
    connect-timeout: 2s
    read-timeout: 10s
    routes:
      - path-prefix: /api/v1/payments
        target: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
      # Refunds are owned by payment-service too: a refund is only meaningful against a payment.
      - path-prefix: /api/v1/refunds
        target: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
      - path-prefix: /api/v1/merchants
        target: ${MERCHANT_SERVICE_BASE_URL:http://localhost:8082}
      # A merchant's own payouts and its delivery history: read-only, and owned by the services
      # that compute them.
      - path-prefix: /api/v1/settlements
        target: ${SETTLEMENT_SERVICE_BASE_URL:http://localhost:8087}
      - path-prefix: /api/v1/webhooks
        target: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8088}
      # Tokenisation, called by the customer's browser rather than by a merchant's server. It is
      # the one path here a card number travels, and routing it through the gateway like everything
      # else is deliberate: it gets the same authentication, the same rate limit and the same
      # correlation id, and vault-service never needs to be exposed directly.
      - path-prefix: /api/v1/tokens
        target: ${VAULT_SERVICE_BASE_URL:http://localhost:8091}

server:
  tomcat:
    # The gateway holds no database pool of its own; its threads are waiting on
    # downstream HTTP, so a larger pool is the right shape here.
    threads:
      max: 200
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The rate limiter fails open on a Redis outage rather than blocking traffic, so losing Redis
    # degrades protection, not service. Reporting the gateway itself as DOWN for that would be a
    # false alarm and would stall the local-startup health probe for something that is not actually
    # stopping the gateway from serving requests.
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
