spring:
  application:
    name: gateway-service

openpay:
  security:
    auth-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
    # Same key auth-service signs with, so a dashboard session is accepted wherever an API key is.
    jwt-secret: ${OPENPAY_JWT_SECRET:}
    # The dashboard is a browser application on a different origin. Defaults to the local dev
    # server only; a deployment names its real origin.
    allowed-origins: ${OPENPAY_DASHBOARD_ORIGINS:http://localhost:5173}
    # Merchant-facing paths the gateway authenticates before forwarding. Merchant admin paths are
    # deliberately absent: they use the admin token, which merchant-service checks itself.
    api-key-paths:
      - /api/v1/payments
      - /api/v1/refunds
      - /api/v1/settlements
      - /api/v1/webhooks
      - /api/v1/protected
  gateway:
    connect-timeout: 2s
    read-timeout: 10s
    routes:
      - path-prefix: /api/v1/payments
        target: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
      # Refunds are owned by payment-service too: a refund is only meaningful against a payment.
      - path-prefix: /api/v1/refunds
        target: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
      - path-prefix: /api/v1/merchants
        target: ${MERCHANT_SERVICE_BASE_URL:http://localhost:8082}
      # A merchant's own payouts and its delivery history: read-only, and owned by the services
      # that compute them.
      - path-prefix: /api/v1/settlements
        target: ${SETTLEMENT_SERVICE_BASE_URL:http://localhost:8087}
      - path-prefix: /api/v1/webhooks
        target: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8088}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
