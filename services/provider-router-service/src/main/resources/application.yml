spring:
  application:
    name: provider-router-service
  datasource:
    # pgjdbc parses and plans a statement afresh until it has seen it prepareThreshold
    # times (default 5), then switches to a server-side prepared statement. Every query
    # this platform runs is one of a small fixed set, so there is nothing to be gained by
    # waiting - promote on first use and keep a larger cache per connection.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openpay_router}?prepareThreshold=1&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5
    username: ${DB_USERNAME:openpay}
    password: ${DB_PASSWORD:openpay}
    hikari:
      # Sized per service rather than left on HikariCP's default of 10. Nine services share
      # one PostgreSQL, so these ceilings are chosen against its max_connections (200, set in
      # docker-compose.yml) with room for every pool to burst at once.
      maximum-pool-size: 15
      # The important one. HikariCP opens minimum-idle connections eagerly and defaults it to
      # maximum-pool-size, which is why this stack sat at 96 of 100 connections while doing
      # nothing at all. Two per service at rest, growing on demand.
      minimum-idle: 2
      # Return a connection to the pool rather than holding it open forever, so a service that
      # goes quiet gives its connections back to the ones that are busy.
      idle-timeout: 60000
      max-lifetime: 900000
      # Fail fast instead of queueing behind an exhausted pool for the default 30 seconds.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: provider-router-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

openpay:
  dlq:
    # The replay tool, on this service because these are the topics it consumes and therefore the
    # dead letters it produces. The list is an allowlist: replay publishes to a topic derived from
    # the request, so accepting an arbitrary one would let the ops token inject any event anywhere.
    enabled: ${OPENPAY_DLQ_REPLAY_ENABLED:true}
    topics:
      - payment.created.v1
      - refund.created.v1
  security:
    # These paths were reachable by anyone who could open the port. "Internal" describes intent,
    # not a control: attempt history names acquirers and their references, and breaker state tells
    # a caller exactly when the platform is degraded.
    #
    # Guarded by the service token rather than the admin token, so payment-service can read attempt
    # history without also holding the credential that opens onboarding and the ledger.
    internal-token: ${OPENPAY_INTERNAL_TOKEN:}
    internal-paths:
      - /internal/router
    # Editing the routing table decides where every payment on the platform goes — it can send all
    # traffic to one acquirer, or to a base URL of the editor's choosing. Closer in authority to
    # issuing a credential than to reading a report, so it sits behind the admin token, and on its
    # own prefix so it is not also covered by the service-token rule above.
    admin-token: ${OPENPAY_ADMIN_TOKEN:}
    admin-paths:
      - /internal/routing-rules
    # Replaying a dead letter puts a message back into the payment flow. It mints no credential,
    # so it sits with the ledger and settlement runs on the ops tier rather than the admin tier.
    ops-token: ${OPENPAY_OPS_TOKEN:}
    ops-paths:
      - /internal/dlq
  router:
    failure-threshold: 3
    breaker-open-duration: 30s
    connect-timeout: 2s
    # Shorter than a bank's simulated hang, so a stuck acquirer becomes a failover.
    read-timeout: 3s
    providers:
      - name: mock-bank-a
        base-url: ${MOCK_BANK_A_URL:http://localhost:9001}
        priority: 10
        enabled: true
      - name: mock-bank-b
        base-url: ${MOCK_BANK_B_URL:http://localhost:9002}
        priority: 20
        enabled: true

server:
  tomcat:
    # Tomcat's default is 200. With a database pool of far fewer, the surplus threads
    # cannot do anything except queue for a connection — they add context switching and
    # hide backpressure, turning "the database is saturated" into "everything is slow".
    # Sized just above the pool so there is room to accept and hand off, not to pile up.
    threads:
      max: 40
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
