server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: an unknown path is handed to index.html so the SPA's own router
    # decides what it means, instead of nginx returning a 404 for a route that only exists
    # inside the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
